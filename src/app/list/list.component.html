<form [formGroup]="recieceForm" (ngSubmit)="onSubmit()">
  <input formControlName="name" />
  <input formControlName="cuisine" />
  <input formControlName="prepTime" />
  <input type="checkbox" formControlName="vegetarian" />
  <input formControlName="dateCreated" />
  <button type="submit">SUBMIT</button>
</form>
<div *ngFor="let r of reciepes">
  <app-reciepe-card
    [r]="r"
    (edit)="startEdit($event)"
    (delete)="deleteReciepe($event)"
  ></app-reciepe-card>
</div>
